services:
  sawserq-gpt:
    build: .
    container_name: sawserq-gpt
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - USE_GPU=false
      - LLM_MODEL_NAME=microsoft/DialoGPT-medium
      - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - PERSIST_DIR=/app/storage
      - RESOURCES_DIR=/app/resources
    volumes:
      - ./resources:/app/resources:ro
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: sawserq-gpt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sawserq-gpt
    profiles:
      - production